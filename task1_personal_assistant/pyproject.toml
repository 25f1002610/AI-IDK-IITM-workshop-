[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "task1-personal-assistant"
version = "0.1.0"
description = "Personal AI Assistant built with Google ADK for the workshop certification assignment"
authors = [
    { name = "ADK Workshop Candidate" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=2.11.0",
    "google-genai>=2.29.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.10.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
